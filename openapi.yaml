                credits_today_cents:
                    description: Credits granted today in cents (prorated for mid-period upgrades)
                    example: 5000
                    format: int64
                    type: integer
                current_plan:
                    $ref: '#/components/schemas/PreviewPlanInfo'
                effective_at:
                    description: When the change takes effect
                    format: date-time
