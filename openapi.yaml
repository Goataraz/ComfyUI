                            schema:
                                properties:
                                    migrated:
                                        description: Whether user data has been migrated (always true in cloud)
                                        type: boolean
                                    storage:
                                        description: Where user data is stored (always "server" in cloud)
                                        type: string
                                required:
                                    - storage
                                    - migrated
                                type: object
                    description: Userdata storage information
                "401":
