                            schema:
                                additionalProperties: true
                                type: object
                    description: Success - Node replacement mappings
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security: []
            summary: Get node replacement mappings
            tags:
