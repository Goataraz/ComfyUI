                "400":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: Bad request (e.g., invalid filename).
                "401":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: Unauthorized.
                "404":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: File not found or invalid path.
                "500":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: General error
